<!DOCTYPE html>
<html>
<head>
<style>
html { background: #1e1e2e; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #1e1e2e; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}
.header-bar { background: #1a56db; padding: 18pt 40pt; margin: 0; }
.header-bar h2 { color: #FFFFFF; font-size: 26pt; margin: 0; }
.content { margin: 10pt 40pt; display: flex; flex-wrap: wrap; gap: 6pt; }
.card {
  flex: 0 0 calc(50% - 3pt); background: #2a2a3e; padding: 6pt 12pt;
  border-radius: 6pt; border-top: 3pt solid #64a8ff;
}
.card h4 { color: #64a8ff; font-size: 11pt; margin: 0 0 3pt 0; }
.card p { color: #CCC; font-size: 9pt; margin: 0 0 1pt 0; }
.good { color: #4ECB71; font-size: 9pt; }
.bad { color: #FF6B6B; font-size: 9pt; }
</style>
</head>
<body>
<div class="header-bar"><h2>关键技术与选型</h2></div>
<div class="content">
  <div class="card">
    <h4>MJPEG 解析方案</h4>
    <p class="bad">cv2.VideoCapture FFmpeg 不稳定</p>
    <p class="good">HTTP raw + SOI/EOI 手动切帧</p>
  </div>
  <div class="card">
    <h4>ESP8266 通信模式</h4>
    <p class="bad">普通模式 需解析+IPD前缀</p>
    <p class="good">透明传输 CIPMODE=1 数据直达</p>
  </div>
  <div class="card">
    <h4>STM32 初始化优化</h4>
    <p>Flash 保存 WiFi, 上电自动连热点</p>
    <p>去掉冗余 AT 指令</p>
    <p>启动: 15s 5s</p>
  </div>
  <div class="card">
    <h4>TCP 稳定性保障</h4>
    <p>SO_KEEPALIVE + 5s 超时检测</p>
    <p>广播时自动清理死连接</p>
  </div>
</div>
</body>
</html>
