<!DOCTYPE html>
<html>
<head>
<style>
html { background: #1e1e2e; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #1e1e2e; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}
.header-bar { background: #1a56db; padding: 18pt 40pt; margin: 0; }
.header-bar h2 { color: #FFFFFF; font-size: 26pt; margin: 0; }
.content { margin: 14pt 40pt; display: flex; gap: 22pt; }
.col { flex: 1; }
.section-title { margin: 0 0 8pt 0;
  border-bottom: 2pt solid #1a56db; padding-bottom: 4pt; }
.section-title p { color: #64a8ff; font-size: 13pt; font-weight: bold; margin: 0; }
.check { color: #4ECB71; font-size: 10pt; margin: 0 0 5pt 0; }
.placeholder-area {
  background: #2a2a3e; border-radius: 6pt;
  padding: 8pt; margin-top: 6pt;
}
</style>
</head>
<body>
<div class="header-bar"><h2>系统测试与结果</h2></div>
<div class="content">
  <div class="col">
    <div class="section-title"><p>功能测试</p></div>
    <p class="check">视频流稳定显示 (localhost:5000)</p>
    <p class="check">YOLO 准确识别行人并实时计数</p>
    <p class="check">超阈值时 Web 弹窗 + STM32 报警</p>
    <p class="check">Web 端动态调节阈值</p>
    <p class="check">报警事件记录数据库, 历史可查</p>
  </div>
  <div class="col">
    <div class="section-title"><p>性能指标</p></div>
    <div id="perf-table" class="placeholder-area" style="height:180pt;background:#252536;">
    </div>
  </div>
</div>
</body>
</html>
