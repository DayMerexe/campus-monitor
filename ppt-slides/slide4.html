<!DOCTYPE html>
<html>
<head>
<style>
html { background: #1e1e2e; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #1e1e2e; font-family: Courier New, monospace;
  display: flex; flex-direction: column;
}
.header-bar { background: #1a56db; padding: 18pt 40pt; margin: 0; }
.header-bar h2 { color: #FFFFFF; font-size: 26pt; margin: 0; font-family: Arial, sans-serif; }
.content { margin: 18pt 40pt; display: flex; flex-direction: column; gap: 14pt; }
.flow-box {
  background: #2a2a3e; border-left: 4pt solid #1a56db; padding: 14pt 20pt;
  border-radius: 4pt;
}
.flow-box p { color: #64a8ff; font-size: 10pt; margin: 0; }
.subsys { display: flex; gap: 16pt; }
.card {
  flex: 1; background: #2a2a3e; padding: 12pt; border-radius: 6pt;
  text-align: center; border-top: 3pt solid #1a56db;
}
.card-num { color: #64a8ff; font-size: 22pt; font-weight: bold; margin: 0 0 4pt 0; font-family: Arial, sans-serif; }
.card-text { color: #E0E6ED; font-size: 10pt; margin: 0; font-family: Arial, sans-serif; }
</style>
</head>
<body>
<div class="header-bar"><h2>系统总体架构</h2></div>
<div class="content">
  <div class="flow-box">
    <p>ESP32-CAM  --HTTP MJPG--  PC (YOLOv8 + Flask)  --TCP :8888--  ESP8266 --UART--  STM32 --LED/Buzzer</p>
  </div>
  <div class="flow-box">
    <p>Flask Web  --Browser--  </p>
  </div>
  <div class="subsys">
    <div class="card">
      <p class="card-num">1</p>
      <p class="card-text">视频采集与AI检测<br/>ESP32-CAM + YOLOv8</p>
    </div>
    <div class="card">
      <p class="card-num">2</p>
      <p class="card-text">Web可视化<br/>Flask + Chart.js</p>
    </div>
    <div class="card">
      <p class="card-num">3</p>
      <p class="card-text">报警执行<br/>TCP + ESP8266 + STM32</p>
    </div>
  </div>
</div>
</body>
</html>
