<!DOCTYPE html>
<html>
<head>
<style>
html { background: #1e1e2e; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #1e1e2e; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}
.header-bar { background: #1a56db; padding: 18pt 40pt; margin: 0; }
.header-bar h2 { color: #FFFFFF; font-size: 26pt; margin: 0; }
.content { margin: 14pt 40pt; display: flex; gap: 20pt; }
.col { flex: 1; }
.section-title { margin: 0 0 8pt 0;
  border-bottom: 2pt solid #1a56db; padding-bottom: 4pt; }
.section-title p { color: #64a8ff; font-size: 13pt; font-weight: bold; margin: 0; }
.step { color: #E0E6ED; font-size: 10pt; margin: 0 0 4pt 0; }
.step b { color: #64a8ff; }
.highlight-box {
  background: #2a2a3e; padding: 10pt 14pt; border-radius: 4pt;
  border-left: 4pt solid #64a8ff; margin-bottom: 8pt;
}
.highlight-box p { color: #E0E6ED; font-size: 10pt; margin: 0; }
.code { font-family: Courier New, monospace; color: #64a8ff; font-size: 10pt; }
</style>
</head>
<body>
<div class="header-bar"><h2>YOLOv8 行人检测</h2></div>
<div class="content">
  <div class="col">
    <div class="section-title"><p>检测流程</p></div>
    <p class="step"><b>1.</b> HTTP 直读 MJPEG 流</p>
    <p class="step"><b>2.</b> SOI/EOI 标记切帧</p>
    <p class="step"><b>3.</b> cv2.imdecode 解码</p>
    <p class="step"><b>4.</b> 320x240 YOLOv8n 推理</p>
    <p class="step"><b>5.</b> person 过滤 (COCO=0)</p>
    <div class="highlight-box" style="margin-top:10pt;">
      <p>协议格式:</p><p class="code">COUNT:N,ALARM:0/1</p>
    </div>
  </div>
  <div class="col">
    <div class="section-title"><p>报警防抖机制</p></div>
    <div class="highlight-box">
      <p>连续 3 帧超阈值  触发报警</p>
    </div>
    <div class="highlight-box">
      <p>连续 3 帧低于阈值 解除报警</p>
    </div>
    <div class="highlight-box">
      <p>状态锁定 3s   防止震荡</p>
    </div>
    <div class="section-title" style="margin-top:10pt;"><p>其他优化</p></div>
    <p class="step">TCP 广播限速 0.5s 防 UART 溢出</p>
    <p class="step">DB 写入限速 2s 间隔</p>
    <p class="step">手动报警暂停自动 TCP 广播</p>
  </div>
</div>
</body>
</html>
